<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#168AAD"/>
  <!-- ballot paper with a check, tilting into the slot -->
  <g transform="rotate(-12 31 24)">
    <rect x="19" y="7" width="24" height="21" rx="2.5" fill="#ffffff"/>
    <path d="M25 17.5 l4 4 l8.5 -9.5" fill="none" stroke="#168AAD" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- ballot box -->
  <path d="M13 33 h38 a3 3 0 0 1 3 3 v16 a3 3 0 0 1 -3 3 h-38 a3 3 0 0 1 -3 -3 v-16 a3 3 0 0 1 3 -3 z" fill="#0d6e89"/>
  <!-- slot -->
  <rect x="24" y="37.5" width="16" height="4" rx="2" fill="#063b4a"/>
</svg>
